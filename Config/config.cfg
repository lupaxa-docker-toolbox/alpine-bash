# Settings for generate, build, and publish.
# The version directory supplies the image tag.

# Required for generate and build
CONTAINER_PREFIX='alpine-bash'

# Required for publish.
DOCKER_HUB_ORG='lupaxa'
GHCR_ORGNAME='lupaxa-docker-toolbox'

# Single-OS trees: Dockerfiles/<version>/ and the image name below.
SINGLE_OS=true
SINGLE_OS_NAME='alpine'
NO_OS_NAME_IN_CONTAINER=true

# Finished image starts bash. Version Helper still uses Alpine's ash.
IMAGE_SHELL='bash'
